name: Build updater

on:
  workflow_dispatch:
    inputs:
      bkmpw_tag:
        description: Official stable bkmpw release with all six native targets
        required: false
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  BKMPW_TAG: ${{ inputs.bkmpw_tag || vars.BKMPW_TAG || 'v0.2.7' }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('updater-pr-{0}', github.event.pull_request.number) || format('updater-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Hosted Windows ARM64 distributions start at Python 3.13.
          python-version: '3.13'
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - name: Test tool catalog
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test npm packaging
        if: runner.os == 'Linux'
        run: node --test scripts/release-tests.mjs
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Check warnings
        run: cargo clippy --locked --all-features --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}
      - name: Smoke test native npm launcher
        run: node scripts/native-launcher-smoke.mjs target/${{ matrix.target }}/release/minecraft-modpack-updater${{ matrix.suffix }}
      - name: Prepare portable files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/minecraft-modpack-updater$SUFFIX" "dist/minecraft-modpack-updater$SUFFIX"
          cp assets/DroidSansFallbackFull.COPYRIGHT assets/Apache-2.0.txt dist/
          chmod +x "dist/minecraft-modpack-updater$SUFFIX"
      - name: Archive portable bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -c 'import os,pathlib,zipfile; p=pathlib.Path("dist"); out=pathlib.Path("minecraft-modpack-updater-"+os.environ["TARGET"]+".zip"); z=zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED); [z.write(f,f.name) for f in p.iterdir()]; z.close()'
      - name: Prepare native self-update assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag must match Cargo version'
          name = f'minecraft-modpack-updater-v{version}-{os.environ["TARGET"]}{os.environ["SUFFIX"]}'
          path = pathlib.Path(name)
          shutil.copyfile('dist/minecraft-modpack-updater' + os.environ['SUFFIX'], path)
          path.with_name(name + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-modpack-updater-${{ matrix.target }}
          path: |
            minecraft-modpack-updater-${{ matrix.target }}.zip
            minecraft-modpack-updater-v*-${{ matrix.target }}*
          if-no-files-found: error
          overwrite: true

  compatibility:
    # PRs can validate the updater before upstream ARM binaries are published.
    # Actual releases require official downloadable candidates on every target.
    if: github.event_name != 'pull_request' || vars.BKMPW_TAG != ''
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            pinned_sha256: dce331c2b86ac701dc2d4a38b16fae0512ed0fdda9d68d0547a286683db9ab7c
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
            pinned_sha256: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            pinned_sha256: c27f51b757269e70fd2eb93840f6c170eae957e250792165ce0263178209e156
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: .exe
            pinned_sha256: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
            pinned_sha256: a51e9ac418f9a2ad287565ba2b591e488c600c848b5b1b2d90c5b54d1cf0e943
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
            pinned_sha256: 72e1a25fef033604ff5d59146a8158a311425b92ecbf5b55035e6bb238a3936d
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: ${{ matrix.target }}
      - name: Validate recommended release tag
        shell: bash
        run: python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["BKMPW_TAG"]), "stable bkmpw tag required"'
      - name: Download official bkmpw and validate checksum and protocol
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          PINNED_SHA: ${{ matrix.pinned_sha256 }}
        run: |
          mkdir -p compatibility
          gh release view "$BKMPW_TAG" --repo bro-know-my-org/BroKnowMyPackwiz --json tagName,isDraft,isPrerelease > compatibility/release.json
          python scripts/tool-catalog.py validate-release --tag "$BKMPW_TAG" --metadata compatibility/release.json
          asset="bkmpw-$BKMPW_TAG-$TARGET$SUFFIX"
          if ! gh release download "$BKMPW_TAG" --repo bro-know-my-org/BroKnowMyPackwiz --pattern "$asset" --pattern "$asset.sha256" --dir compatibility; then
            echo "Official bkmpw $BKMPW_TAG must include $TARGET before updater publication." >&2
            exit 1
          fi
          chmod +x "compatibility/$asset"
          expected=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text().split()[0])' "compatibility/$asset.sha256")
          if [[ "$BKMPW_TAG" == v0.2.5 && -n "$PINNED_SHA" ]]; then
            [[ "$expected" == "$PINNED_SHA" ]] || exit 1
          fi
          python scripts/tool-catalog.py verify-bkmpw --binary "compatibility/$asset" --sha256 "$expected" --version "${BKMPW_TAG#v}" --target "$TARGET" --output "bkmpw-$TARGET.json"
          python -c 'import pathlib,sys; print("MMPU_TEST_BKMPW=" + str(pathlib.Path(sys.argv[1]).resolve()))' "compatibility/$asset" >> "$GITHUB_ENV"
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Verify real bkmpw preparation, sync and manifests
        run: cargo test --locked --all-features --target ${{ matrix.target }} --test bkmpw_compatibility
      - uses: actions/upload-artifact@v4
        with:
          name: tested-bkmpw-${{ matrix.target }}
          path: bkmpw-${{ matrix.target }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-modpack-updater-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-bkmpw-*
          merge-multiple: true
          path: dist
      - name: Build verified tool catalog
        run: python scripts/tool-catalog.py catalog --assets dist --version "${GITHUB_REF_NAME#v}" --output dist/tool-releases.json
      - name: Publish native files, checksums, archives and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm dist/bkmpw-*.json
          python scripts/publish-release.py --assets dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  npm:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up npm for trusted publishing
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-modpack-updater-*
          merge-multiple: true
          path: dist
      - name: Prepare and pack all native packages
        run: node scripts/prepare-npm.mjs dist target/npm "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: target/npm/*.tgz
          overwrite: true
      - name: Publish native packages then launcher
        run: node scripts/publish-npm.mjs target/npm "${GITHUB_REF_NAME#v}"
