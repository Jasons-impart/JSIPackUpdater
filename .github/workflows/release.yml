name: Build updater

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('updater-pr-{0}', github.event.pull_request.number) || format('updater-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            bkmpw_sha256: dce331c2b86ac701dc2d4a38b16fae0512ed0fdda9d68d0547a286683db9ab7c
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            bkmpw_sha256: c27f51b757269e70fd2eb93840f6c170eae957e250792165ce0263178209e156
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
            bkmpw_sha256: a51e9ac418f9a2ad287565ba2b591e488c600c848b5b1b2d90c5b54d1cf0e943
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ""
            bkmpw_sha256: 72e1a25fef033604ff5d59146a8158a311425b92ecbf5b55035e6bb238a3936d
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Test tool catalog
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test npm packaging
        if: runner.os == 'Linux'
        run: node --test scripts/release-tests.mjs
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Check warnings
        run: cargo clippy --locked --all-features --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}
      - name: Verify recommended bkmpw independently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          EXPECTED_SHA: ${{ matrix.bkmpw_sha256 }}
        run: |
          mkdir -p dist compatibility
          cp "target/$TARGET/release/minecraft-modpack-updater$SUFFIX" "dist/minecraft-modpack-updater$SUFFIX"
          cp assets/DroidSansFallbackFull.COPYRIGHT assets/Apache-2.0.txt dist/
          asset="bkmpw-v0.2.5-$TARGET$SUFFIX"
          gh release download v0.2.5 --repo bro-know-my-org/BroKnowMyPackwiz --pattern "$asset" --dir compatibility
          chmod +x "compatibility/$asset" "dist/minecraft-modpack-updater$SUFFIX"
          python scripts/tool-catalog.py verify-bkmpw --binary "compatibility/$asset" --sha256 "$EXPECTED_SHA" --version 0.2.5 --target "$TARGET" --output "bkmpw-$TARGET.json"
          python -c 'import pathlib,sys; print("MMPU_TEST_BKMPW=" + str(pathlib.Path(sys.argv[1]).resolve()))' "compatibility/$asset" >> "$GITHUB_ENV"
      - name: Verify real bkmpw preparation, sync and manifests
        run: cargo test --locked --all-features --target ${{ matrix.target }} --test bkmpw_compatibility
      - name: Archive portable bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -c 'import os,pathlib,zipfile; p=pathlib.Path("dist"); out=pathlib.Path("minecraft-modpack-updater-"+os.environ["TARGET"]+".zip"); z=zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED); [z.write(f,f.name) for f in p.iterdir()]; z.close()'
      - name: Prepare native self-update assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag must match Cargo version'
          name = f'minecraft-modpack-updater-v{version}-{os.environ["TARGET"]}{os.environ["SUFFIX"]}'
          path = pathlib.Path(name)
          shutil.copyfile('dist/minecraft-modpack-updater' + os.environ['SUFFIX'], path)
          path.with_name(name + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-modpack-updater-${{ matrix.target }}
          path: |
            minecraft-modpack-updater-${{ matrix.target }}.zip
            minecraft-modpack-updater-v*-${{ matrix.target }}*
            bkmpw-${{ matrix.target }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-modpack-updater-*
          merge-multiple: true
          path: dist
      - name: Build verified tool catalog
        run: python scripts/tool-catalog.py catalog --assets dist --version "${GITHUB_REF_NAME#v}" --output dist/tool-releases.json
      - name: Publish native files, checksums, archives and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm dist/bkmpw-*.json
          python scripts/publish-release.py --assets dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  npm:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      NPM_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-modpack-updater-*
          merge-multiple: true
          path: dist
      - name: Prepare and pack all native packages
        run: node scripts/prepare-npm.mjs dist target/npm "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: target/npm/*.tgz
          overwrite: true
      - name: Publish native packages then launcher
        if: env.NPM_ENABLED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs target/npm "${GITHUB_REF_NAME#v}"
