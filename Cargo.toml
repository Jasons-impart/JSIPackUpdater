[package]
name = "minecraft-modpack-updater"
version = "0.1.2"
edition = "2024"
description = "Shared update planner and CLI for Minecraft modpacks"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
diffy = "0.4"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
flate2 = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
ratatui = "0.29"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Pipes"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object"] }
